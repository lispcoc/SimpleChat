<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Chat</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 10px;
        padding: 0;
      }

      input {
        padding: 2px;
        border: 1px solid #ccc;
      }

      #main {
        margin: 20px;
      }

      #roomDescriptionSection {
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #f9f9f9;
        padding: 10px;
      }

      #chat {
        max-width: 600px;
        margin: 20px auto;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #f9f9f9;
      }

      #chatContainer {
        display: flex;
        height: 100%;
      }

      #messageSection {
        flex: 3;
        padding: 10px;
      }

      #userSection {
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #f9f9f9;
        flex: 1;
        padding: 10px;
      }

      #messages {
        overflow-y: auto;
      }

      #users {
        overflow-y: auto;
      }

      #input {
        display: flex;
        margin-top: 10px;
      }

      #inputDiv {
        max-width: 800px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #inputDiv span {
        white-space: nowrap;
      }

      #inputDiv input {
        flex: 1;
        width: 80%;
        padding: 2px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }

      #inputDiv button {
        padding: 2px;
        white-space: nowrap;
      }

      #controls button {
        padding: 2px;
      }

      span.username {
        font-weight: bold;
      }

      span.timestamp {
        font-size: 0.8em;
        color: gray;
      }
    </style>
  </head>

  <body>
    <div id="main">
      <h2 id="roomName">roomName</h2>

      <div id="controls">
        <input type="text" id="usernameInput" placeholder="名前" />
        <button id="enterButton">入室</button>
        <button id="leaveButton" style="display: none">退室</button>
      </div>
      <div id="inputDiv" style="display: none">
        <span id="usernameDisplay"></span>
        <input
          type="text"
          id="messageInput"
          placeholder="Type your message..."
        />
        <button id="sendButton">発言</button>
      </div>

      <!-- 入室者リスト -->
      <div id="userSection">
        <span style="font-weight: bold">現在の入室者: </span>
        <span id="users"></span>
      </div>

      <div id="roomDescriptionSection">
        <span style="font-weight: bold">ルーム紹介</span> <a>[表示]</a>
        <p id="roomDescription">roomDescription</p>
      </div>

      <div id="chatContainer" style="display: flex; height: 100%">
        <!-- メッセージ欄 -->
        <div id="messageSection">
          <div id="messages"></div>
        </div>
      </div>
      <div id="editRoom"></div>
    </div>

    <script>
      const API_URL = '/api/messages'
      const messagesDiv = document.getElementById('messages')
      const inputDiv = document.getElementById('inputDiv')
      const messageInput = document.getElementById('messageInput')
      const sendButton = document.getElementById('sendButton')
      const usernameInput = document.getElementById('usernameInput')
      const enterButton = document.getElementById('enterButton')
      const leaveButton = document.getElementById('leaveButton')
      const usersDiv = document.getElementById('users')
      const editRoomDiv = document.getElementById('editRoom')
      const roomDescription = document.getElementById('roomDescription')
      const roomDescriptionToggleButton = document.querySelector(
        '#roomDescriptionSection a'
      )

      let isInRoom = false // 入室状態を管理するフラグ
      let currentUsername = '' // 現在のユーザー名を管理
      let lastUpdated = 0 // 最後に受信したメッセージの更新タイムスタンプ
      // 現在の URL のクエリパラメータを取得
      const params = new URLSearchParams(window.location.search)

      // パラメータ "roomId" の値を取得
      const roomId = params.get('roomId')

      // 入室者一覧を取得して表示
      async function fetchUsers() {
        const params = new URLSearchParams({
          roomId: roomId
        })
        const response = await fetch(`${API_URL}?${params.toString()}`)
        const data = await response.json()

        if (response.status === 200) {
          console.log(data)
          // 入室者一覧を表示
          const usersDiv = document.getElementById('users')
          usersDiv.innerHTML = '' // リストをクリア
          data.users.forEach(user => {
            const userElement = document.createElement('span')
            userElement.textContent = user.username || 'Unknown' // ユーザー名を表示
            usersDiv.appendChild(userElement)
          })

          // 自分が入室済みか確認
          const user = data.users.find(user => user.ip === data.clientIp)
          if (user) {
            isInRoom = true // 入室状態を更新
            currentUsername = user.username // 現在のユーザー名を保存
          } else {
            isInRoom = false // 入室していない状態に更新
          }

          updateUI() // UI を更新
        }
      }
      // メッセージを取得して表示
      async function fetchMessages() {
        try {
          const params = new URLSearchParams({
            lastUpdated: lastUpdated,
            roomId: roomId
          })
          const response = await fetch(`${API_URL}?${params.toString()}`)
          if (response.status === 200) {
            const data = await response.json()
            lastUpdated = data.lastUpdated // サーバーから最新の更新タイムスタンプを取得

            // メッセージを表示
            const messagesDiv = document.getElementById('messages')
            messagesDiv.innerHTML = '' // メッセージをクリア
            data.messages
              .slice()
              .reverse()
              .forEach(msg => {
                const messageElement = document.createElement('div')
                if (msg.system) {
                  // システムメッセージのスタイル
                  messageElement.style.color = 'gray'
                  messageElement.textContent = `[SYSTEM] ${msg.text}`
                } else {
                  // 通常メッセージ
                  const username = msg.username || 'Unknown'
                  const usenameElement = document.createElement('span')
                  usenameElement.className = 'username'
                  usenameElement.textContent = `${username}`
                  messageElement.textContent = `> ${msg.text}`
                  messagesDiv.appendChild(usenameElement)
                }
                messagesDiv.appendChild(messageElement)
                if (msg.timestamp) {
                  const formattedTime = new Date(msg.timestamp).toLocaleString()
                  const timestampElement = document.createElement('span')
                  timestampElement.className = 'timestamp'
                  timestampElement.textContent = ` (${formattedTime})`
                  messageElement.appendChild(timestampElement)
                }
                const hr = document.createElement('hr')
                messagesDiv.appendChild(hr)
              })

            messagesDiv.scrollTop = messagesDiv.scrollHeight

            // 入室者一覧を更新
            fetchUsers()
          }
        } catch (error) {
          console.error('Error fetching messages:', error)
        }
      }

      // 入室
      async function enterRoom() {
        const username = usernameInput.value.trim()
        if (!username) {
          alert('名前を入力してください。')
          return
        }

        const params = new URLSearchParams({
          roomId: roomId
        })
        const response = await fetch(`${API_URL}?${params.toString()}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'enter', username })
        })

        if (response.ok) {
          currentUsername = username // 現在のユーザー名を保存
          isInRoom = true // 入室状態を更新
          updateUI() // UI を更新
          toggleRoomDescription(false)
          fetchMessages()
        } else {
          const errorData = await response.json()
          alert(errorData.error)
        }
      }

      // 退室
      async function leaveRoom() {
        const params = new URLSearchParams({
          roomId: roomId
        })
        const response = await fetch(`${API_URL}?${params.toString()}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'leave' })
        })

        if (response.ok) {
          isInRoom = false // 入室状態を更新
          updateUI() // UI を更新
          toggleRoomDescription(true)
          fetchMessages()
        } else {
          const errorData = await response.json()
          alert(errorData.error)
        }
      }

      // メッセージ送信
      async function sendMessage() {
        const text = messageInput.value
        if (text) {
          const params = new URLSearchParams({
            roomId: roomId
          })
          const response = await fetch(`${API_URL}?${params.toString()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'message', text })
          })

          if (response.ok) {
            messageInput.value = ''
            fetchMessages()
          } else {
            const errorData = await response.json()
            alert(errorData.error)
          }
        }
      }

      // ルーム情報の取得
      async function getRoomInfo() {
        const params = new URLSearchParams({
          roomId: roomId,
          mode: 'roomInfo'
        })
        const response = await fetch(`${API_URL}?${params.toString()}`)
        if (response.ok) {
          const data = await response.json()
          console.log(data)
          // ルーム情報をページに表示
          const roomNameElement = document.getElementById('roomName')
          const roomDescriptionElement =
            document.getElementById('roomDescription')
          roomNameElement.textContent = data.name
          roomDescriptionElement.innerText = data.description
          document.title = `${data.name} - Chat Room`
          if (data.options.private) {
            messagesDiv.innerHTML = '未入室者閲覧禁止設定です。'
          }

          return data
        } else {
          const errorData = await response.json()
          alert(errorData.error)
          return null
        }
      }

      // UI の更新
      function updateUI() {
        const usernameDisplay = document.getElementById('usernameDisplay')
        if (isInRoom) {
          enterButton.style.display = 'none' // 入室ボタンを非表示
          usernameInput.style.display = 'none'
          leaveButton.style.display = 'inline-block' // 退室ボタンを表示
          inputDiv.style.display = 'block' // メッセージ入力フォームを表示
          usernameDisplay.textContent = currentUsername // ユーザー名を表示
        } else {
          enterButton.style.display = 'inline-block' // 入室ボタンを表示
          usernameInput.style.display = 'inline-block'
          leaveButton.style.display = 'none' // 退室ボタンを非表示
          inputDiv.style.display = 'none' // メッセージ入力フォームを非表示
          usernameDisplay.textContent = '' // ユーザー名をクリア
        }
      }

      // UIをすべて隠す
      function hideAllUI() {
        enterButton.style.display = 'none' // 入室ボタンを非表示
        usernameInput.style.display = 'none'
        leaveButton.style.display = 'none' // 退室ボタンを非表示
        inputDiv.style.display = 'none' // メッセージ入力フォームを非表示
        messagesDiv.style.display = 'none'
      }

      // メッセージを定期的に取得
      function pollMessages(interval = 5000) {
        setInterval(fetchMessages, interval) // 指定した間隔で fetchMessages を呼び出す
      }

      // 初期化処理
      async function initializePage() {
        if (roomId == null) {
          hideAllUI()
          alert('ルームIDが不正です。')
        } else {
          const roomData = await getRoomInfo()
          if (roomData == null) {
            hideAllUI()
          } else {
            // 初回メッセージ取得
            fetchMessages()
            // 定期的にメッセージを取得
            pollMessages()
          }
          editRoomDiv.innerHTML = `<a href="editRoom.html?roomId=${roomId}">部屋の編集</a>`
        }
      }

      function toggleRoomDescription(show = true) {
        if (show) {
          roomDescription.style.display = 'block'
          roomDescriptionToggleButton.textContent = '[非表示]'
        } else {
          roomDescription.style.display = 'none'
          roomDescriptionToggleButton.textContent = '[表示]'
        }
      }

      sendButton.addEventListener('click', sendMessage)
      messageInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') {
          sendMessage()
        }
      })

      enterButton.addEventListener('click', enterRoom)
      leaveButton.addEventListener('click', leaveRoom)

      document.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          const activeElement = document.activeElement
          if (activeElement === messageInput) {
            sendButton.click()
          } else if (activeElement === usernameInput) {
            enterButton.click()
          }
        }
      })

      roomDescriptionToggleButton.addEventListener('click', () => {
        if (roomDescription.style.display === 'none') {
          toggleRoomDescription(true)
        } else {
          toggleRoomDescription(false)
        }
      })

      // ページ初期化
      initializePage()
    </script>
  </body>
</html>
