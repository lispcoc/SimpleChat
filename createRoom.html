<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>部屋の作成</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }

      form {
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #f9f9f9;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input,
      textarea {
        width: 90%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        padding: 2px;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <h2>部屋の作成</h2>
    <form id="createRoomForm">
      <label for="roomName">部屋の名前 (必須)</label>
      <input
        type="text"
        id="roomName"
        name="roomName"
        placeholder="部屋の名前"
        required
      />

      <label for="roomDescription">部屋の説明 (必須)</label>
      <textarea
        id="roomDescription"
        name="roomDescription"
        placeholder="部屋の説明"
        rows="4"
        required
      ></textarea>

      <label for="roomPassword">パスワード (必須)</label>
      <input
        type="password"
        id="roomPassword"
        name="roomPassword"
        placeholder="パスワード"
        required
      />

      <label for="roomSpecialKey_1">特殊キーの設定</label>
      <input
        type="text"
        id="roomSpecialKey_1"
        name="roomSpecialKey_1"
        placeholder="特定の発言を検知するとランダムにテキストを表示します。(例: おみくじ)"
      />
      <label for="roomSpecialText_1">特殊テキストの設定</label>
      <textarea
        id="roomSpecialText_1"
        name="roomSpecialText_1"
        placeholder="大吉&#13;&#10;中吉&#13;&#10;吉&#13;&#10;末吉&#13;&#10;凶"
        rows="8"
      ></textarea>

      <button type="submit">Create Room</button>
    </form>

    <script>
      const API_URL = '/api/messages'
      const form = document.getElementById('createRoomForm')

      form.addEventListener('submit', async event => {
        event.preventDefault()

        const roomName = document.getElementById('roomName').value.trim()
        const roomDescription = document
          .getElementById('roomDescription')
          .value.trim()
        const roomPassword = document
          .getElementById('roomPassword')
          .value.trim()
        const roomSpecialKey_1 = document
          .getElementById('roomSpecialKey_1')
          .value.trim()
        const roomSpecialText_1 = document
          .getElementById('roomSpecialText_1')
          .value.trim()
          .replace(/\r/g, '')
          .split('\n')

        let roomSpecialKeys = {}
        if (roomSpecialKey_1) {
          roomSpecialKeys[roomSpecialKey_1] = roomSpecialText_1
        }

        if (!roomName || !roomDescription || !roomPassword) {
          alert('All fields are required.')
          return
        }

        try {
          const params = new URLSearchParams({
            mode: 'createRoom'
          })
          const response = await fetch(`${API_URL}?${params.toString()}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: roomName,
              description: roomDescription,
              password: roomPassword,
              specialKeys: roomSpecialKeys
            })
          })

          if (response.ok) {
            const data = await response.json()
            alert('Room created successfully!')
            console.log(data)
            form.reset()
            window.location.href = `/index.html?${data.id}`
          } else {
            const errorData = await response.json()
            alert(`Error: ${errorData.error}`)
          }
        } catch (error) {
          console.error('Error creating room:', error)
          alert('An error occurred while creating the room.')
        }
      })
    </script>
  </body>
</html>
