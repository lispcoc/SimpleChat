<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Chat</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 10px;
        padding: 0;
      }

      div.main {
        max-width: 800px;
        margin: 0 auto;
      }

      a.roomLink {
        text-decoration: none;
        color: blue;
      }
    </style>
  </head>

  <body>
    <div id="main">
      <h3>部屋の一覧</h3>

      <hr />
      <div id="roomList"></div>
      <hr />
      <div>
        <a href="createRoom.html">部屋の作成</a>
      </div>
    </div>

    <script>
      const API_URL = '/api/messages'
      const roomListDiv = document.getElementById('roomList')
      const params = new URLSearchParams(window.location.search)

      async function getRoomList() {
        const params = new URLSearchParams({
          mode: 'roomList'
        })
        const response = await fetch(`${API_URL}?${params.toString()}`)
        const data = await response.json()

        if (response.status === 200) {
          console.log(data)
          var i = 1
          data.forEach(room => {
            let numString = `${i}`
            const roomLinkDiv = document.createElement('div')
            const roomNumber = document.createElement('span')
            roomNumber.textContent = numString.padStart(2, '0')
            const roomLink = document.createElement('a')
            roomLink.href = `/chat.html?roomId=${room.id}`
            roomLink.textContent = room.name
            roomLink.className = 'roomLink'

            roomLinkDiv.appendChild(roomNumber)
            roomLinkDiv.appendChild(roomLink)
            roomListDiv.appendChild(roomLinkDiv)
            i++
          })
        }
      }

      getRoomList()
    </script>
  </body>
</html>
