<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    #chat { max-width: 600px; margin: 20px auto; padding: 10px; border: 1px solid #ccc; }
    #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
    #input { display: flex; margin-top: 10px; }
    #input input { flex: 1; padding: 10px; border: 1px solid #ccc; }
    #input button { padding: 10px; border: 1px solid #ccc; background: #007BFF; color: white; }
    #controls { margin-top: 10px; }
    #controls button { padding: 10px; margin-right: 5px; border: 1px solid #ccc; background: #28a745; color: white; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <div id="input">
      <input type="text" id="messageInput" placeholder="Type your message...">
      <button id="sendButton">Send</button>
    </div>
    <div id="controls">
      <button id="enterButton">Enter Room</button>
      <button id="leaveButton">Leave Room</button>
    </div>
  </div>

  <script>
    const API_URL = '/api/messages';
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const enterButton = document.getElementById('enterButton');
    const leaveButton = document.getElementById('leaveButton');

    // メッセージを取得して表示
    async function fetchMessages() {
      const response = await fetch(API_URL);
      const data = await response.json();

      // メッセージを表示
      messagesDiv.innerHTML = '';
      data.messages.forEach((msg) => {
        const messageElement = document.createElement('div');
        messageElement.textContent = `${msg.text} (from ${msg.ip})`;
        messagesDiv.appendChild(messageElement);
      });

      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 入室
    async function enterRoom() {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'enter' }),
      });
      fetchMessages();
    }

    // 退室
    async function leaveRoom() {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'leave' }),
      });
      fetchMessages();
    }

    // メッセージを送信
    async function sendMessage() {
      const text = messageInput.value;
      if (text) {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'message', text }),
        });
        messageInput.value = '';
        fetchMessages();
      }
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    enterButton.addEventListener('click', enterRoom);
    leaveButton.addEventListener('click', leaveRoom);

    // 初回メッセージ取得
    fetchMessages();
  </script>
</body>
</html>
