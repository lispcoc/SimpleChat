<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>部屋の編集</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0 auto;
        padding: 20px;
      }

      div.main {
        max-width: 600px;
        margin: 0 auto;
      }

      form {
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #f9f9f9;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input,
      textarea {
        width: 90%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        padding: 2px;
        margin-right: 5px;
      }
    </style>
  </head>

  <div class="main">
    <h2>部屋の編集</h2>

    <div id="backToRoom"></div>

    <form id="loginRoomEdit">
      <label for="roomName">パスワード</label>
      <input
        type="password"
        id="roomPasswordCurrent"
        name="roomPasswordCurrent"
        placeholder="パスワード"
        required
      />

      <button type="submit" id="loginButton" name="loginButton">
        ログイン
      </button>
    </form>

    <form id="createRoomForm" style="display: none">
      <label for="roomName">部屋の名前 (必須)</label>
      <input
        type="text"
        id="roomName"
        name="roomName"
        placeholder="部屋の名前"
        required
      />

      <label for="roomDescription">部屋の説明 (必須)</label>
      <textarea
        id="roomDescription"
        name="roomDescription"
        placeholder="部屋の説明"
        rows="4"
        required
      ></textarea>

      <label for="roomOptionPrivate">未入室者のログ確認</label>
      <select name="roomOptionPrivate" id="roomOptionPrivate">
        <option value="true">許可する</option>
        <option value="false">許可しない</option>
      </select>

      <label for="roomPassword">パスワード (必須)</label>
      <input
        type="password"
        id="roomPassword"
        name="roomPassword"
        placeholder="パスワード"
        required
      />

      <label for="roomSpecialKey_1">特殊キーの設定</label>
      <input
        type="text"
        id="roomSpecialKey_1"
        name="roomSpecialKey_1"
        placeholder="特定の発言を検知するとランダムにテキストを表示します。(例: おみくじ)"
      />
      <label for="roomSpecialText_1">特殊テキストの設定</label>
      <textarea
        id="roomSpecialText_1"
        name="roomSpecialText_1"
        placeholder="大吉&#13;&#10;中吉&#13;&#10;吉&#13;&#10;末吉&#13;&#10;凶"
        rows="8"
      ></textarea>

      <button type="submit" id="editButton" name="editButton">
        変更を反映
      </button>
    </form>
  </div>

  <script>
    const API_URL = '/api/messages'
    const backToRoom = document.getElementById('backToRoom')
    const loginForm = document.getElementById('loginRoomEdit')
    const loginButton = document.getElementById('loginButton')
    const editForm = document.getElementById('createRoomForm')
    const editButton = document.getElementById('editButton')
    const params = new URLSearchParams(window.location.search)
    const roomId = params.get('roomId')
    const roomSpecialKeyList = [document.getElementById('roomSpecialKey_1')]
    const roomSpecialTextList = [document.getElementById('roomSpecialText_1')]

    loginForm.addEventListener('submit', async event => {
      event.preventDefault()

      const roomPassword = document
        .getElementById('roomPasswordCurrent')
        .value.trim()

      if (!roomId) {
        alert('ルームIDが不正です。')
        return
      }

      if (!roomPassword) {
        alert('All fields are required.')
        return
      }

      loginButton.disabled = true
      try {
        const params = new URLSearchParams({
          mode: 'roomInfoForEdit'
        })
        const response = await fetch(`${API_URL}?${params.toString()}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            roomId: roomId,
            password: roomPassword
          })
        })

        if (response.ok) {
          const data = await response.json()
          console.log(data)
          document.getElementById('roomName').value = data.name
          document.getElementById('roomDescription').value = data.description
          document.getElementById('roomPassword').value = roomPassword

          var i = 0
          for (const key in data.specialKeys) {
            if (!roomSpecialKeyList[i]) {
              break
            }
            console.log(key)
            roomSpecialKeyList[i].value = key
            roomSpecialTextList[i].value = data.specialKeys[key]
            i++
          }

          loginForm.style.display = 'none'
          editForm.style.display = 'block'
        } else {
          const errorData = await response.json()
          alert(`Error: ${errorData.error}`)
        }
      } catch (error) {
        console.error('Error editting room:', error)
        alert('An error occurred while editting the room.')
      }
      loginButton.disabled = false
    })

    editForm.addEventListener('submit', async event => {
      event.preventDefault()

      const roomName = document.getElementById('roomName').value.trim()
      const roomDescription = document
        .getElementById('roomDescription')
        .value.trim()
      const roomPassword = document.getElementById('roomPassword').value.trim()
      const roomSpecialKey_1 = document
        .getElementById('roomSpecialKey_1')
        .value.trim()
      const roomSpecialText_1 = document
        .getElementById('roomSpecialText_1')
        .value.trim()
        .replace(/\r/g, '')
        .split('\n')

      let roomSpecialKeys = {}
      if (roomSpecialKey_1) {
        roomSpecialKeys[roomSpecialKey_1] = roomSpecialText_1
      }

      const roomOptionPrivate =
        document.getElementById('roomOptionPrivate').value.trim() === 'true'

      let roomOptions = {
        private: roomOptionPrivate
      }

      if (!roomId) {
        alert('ルームIDが不正です。')
        return
      }

      if (!roomName || !roomDescription || !roomPassword) {
        alert('All fields are required.')
        return
      }

      editButton.disabled = true
      try {
        const params = new URLSearchParams({
          mode: 'editRoom'
        })
        const response = await fetch(`${API_URL}?${params.toString()}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            roomId: roomId,
            name: roomName,
            description: roomDescription,
            password: roomPassword,
            specialKeys: roomSpecialKeys,
            options: roomOptions
          })
        })

        if (response.ok) {
          const data = await response.json()
          alert('変更を反映しました。')
          console.log(data)
          editForm.reset()
        } else {
          const errorData = await response.json()
          alert(`Error: ${errorData.error}`)
        }
      } catch (error) {
        console.error('Error creating room:', error)
        alert('An error occurred while creating the room.')
      }
      editButton.disabled = false
    })

    const backLink = document.createElement('a')
    backLink.href = `/chat.html?roomId=${roomId}`
    backLink.textContent = '部屋に戻る'
    backLink.style.textDecoration = 'none'
    backLink.style.color = 'blue'

    backToRoom.appendChild(backLink)
  </script>
</html>
